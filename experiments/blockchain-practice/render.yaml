# Select this file as the custom Blueprint path.
# Docker paths below are relative to the repository root, not this YAML file.
services:
  - type: web
    name: blockchain-practice
    runtime: docker
    branch: blockchain-practice
    region: ohio
    plan: free
    dockerfilePath: ./experiments/blockchain-practice/Dockerfile
    dockerContext: ./experiments/blockchain-practice
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /api/education/health
    envVars:
      - key: PORT
        value: "8080"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: TEAM_DATABASE_URL
        sync: false
      - key: TEAM_DATABASE_PREFIX
        value: team
      - key: TEAM_TEACHER_SECRET
        generateValue: true
      - key: TEAM_TRUST_PROXY
        value: "1"
      - key: TEAM_PUBLIC_URL
        value: https://blockchain-practice.onrender.com
      - key: TEAM_SITE_MODE
        value: primary
      - key: TEAM_SITE_TRANSFER_KEY
        sync: false
      - key: TEAM_SITE_PREVIOUS_ORIGIN
        value: https://kakao-team-flask.onrender.com
      - key: TEAM_SITE_CANONICAL_ORIGIN
        value: https://blockchain-practice.onrender.com
# TEAM_PUBLIC_URL can be added after a custom domain is configured.
# With no override, the browser builds participant links from its HTTPS origin.
