# Select this file as the custom Blueprint path.
# Docker paths below are relative to the repository root, not this YAML file.
services:
  - type: web
    name: kakao-team-flask
    runtime: docker
    branch: codex/kakao-flask-run
    region: ohio
    plan: free
    dockerfilePath: ./experiments/kakao-flask/Dockerfile
    dockerContext: ./experiments/kakao-flask
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /api/education/health
    envVars:
      - key: PORT
        value: "8080"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: TEAM_DATABASE_URL
        sync: false
      - key: TEAM_DATABASE_PREFIX
        value: team
      - key: TEAM_TEACHER_SECRET
        generateValue: true
      - key: TEAM_TRUST_PROXY
        value: "1"
# TEAM_PUBLIC_URL can be added after a custom domain is configured.
# With no override, the browser builds participant links from its HTTPS origin.
