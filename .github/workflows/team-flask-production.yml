name: Team Flask production container

on:
  push:
    branches: [codex/kakao-flask-run]
    paths:
      - experiments/kakao-flask/**
      - .github/workflows/team-flask-production.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: team-flask-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-restart:
    # Standard public-repository runners are free; never use a private/larger runner.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      IMAGE_TAG: team-flask-production:${{ github.run_id }}-${{ github.run_attempt }}
      CONTAINER_NAME: team-flask-production-${{ github.run_id }}-${{ github.run_attempt }}
      VOLUME_NAME: team-flask-data-${{ github.run_id }}-${{ github.run_attempt }}
      PROBE_BASE_URL: http://127.0.0.1:18080
      GIT_TERMINAL_PROMPT: "0"

    steps:
      - name: Fetch exact public commit without credentials
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -c advice.detachedHead=false checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Build production Docker image
        run: |
          set -euo pipefail
          docker build --tag "$IMAGE_TAG" experiments/kakao-flask

      - name: Verify Gunicorn, real WebSocket and replacement-container persistence
        run: |
          set -euo pipefail
          private_dir="${RUNNER_TEMP}/team-production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 0700 "$private_dir"
          holder_name="${CONTAINER_NAME}-holder"
          holder_pid=""
          export TEAM_TEACHER_SECRET
          TEAM_TEACHER_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export TEAM_VERIFY_TEACHER_SECRET="$TEAM_TEACHER_SECRET"

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs --tail 100 "$CONTAINER_NAME" 2>&1 || true
              if [ -f "$private_dir/graceful.log" ]; then
                cat "$private_dir/graceful.log"
              fi
            fi
            docker rm -f "$holder_name" >/dev/null 2>&1 || true
            if [ -n "$holder_pid" ]; then wait "$holder_pid" 2>/dev/null || true; fi
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
            docker volume rm "$VOLUME_NAME" >/dev/null 2>&1 || true
            rm -f -- "$private_dir/state.json" "$private_dir/prepare.json" "$private_dir/verify.json"
            rm -f -- "$private_dir/graceful-ready.json" "$private_dir/graceful.log"
            rmdir -- "$private_dir" 2>/dev/null || true
            exit "$status"
          }

          hold_authenticated_websocket() {
            docker run --rm --name "$holder_name" --network host \
              --user "$(id -u):$(id -g)" \
              --env TEAM_VERIFY_TEACHER_SECRET \
              --mount "type=bind,source=${GITHUB_WORKSPACE}/experiments/kakao-flask/tests,target=/probes,readonly" \
              --mount "type=bind,source=${private_dir},target=/probe-state" \
              --entrypoint python "$IMAGE_TAG" -B -X utf8 \
              /probes/graceful_shutdown_probe.py --base-url "$PROBE_BASE_URL" \
              --state-file /probe-state/state.json \
              --ready-file /probe-state/graceful-ready.json --timeout 12 \
              >"$private_dir/graceful.log" 2>&1 &
            holder_pid=$!
            for attempt in {1..80}; do
              if [ -f "$private_dir/graceful-ready.json" ]; then break; fi
              if ! kill -0 "$holder_pid" 2>/dev/null; then
                wait "$holder_pid"
                return 1
              fi
              sleep 0.1
            done
            test -f "$private_dir/graceful-ready.json"
          }
          trap cleanup EXIT

          start_server() {
            docker run --detach --name "$CONTAINER_NAME" \
              --publish 127.0.0.1:18080:8080 \
              --mount "type=volume,source=${VOLUME_NAME},target=/data" \
              --env TEAM_TEACHER_SECRET --env PORT=8080 \
              --env TEAM_DATA_DIR=/data \
              --env KAKAO_PRACTICE_DB=/data/basic.sqlite3 \
              --env TEAM_EDUCATION_DB=/data/education.sqlite3 \
              "$IMAGE_TAG" >/dev/null
            for attempt in {1..90}; do
              if curl --fail --silent --max-time 1 "$PROBE_BASE_URL/api/education/health" >/dev/null; then
                break
              fi
              if [ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" != true ]; then
                return 1
              fi
              sleep 1
            done
            curl --fail --silent --show-error --max-time 3 "$PROBE_BASE_URL/api/education/health" >/dev/null
          }

          check_server_identity() {
            docker exec "$CONTAINER_NAME" python -B -c '
          from pathlib import Path
          import stat
          lines = Path("/proc/1/status").read_text().splitlines()
          for label in ("Uid:", "Gid:"):
              fields = next(line for line in lines if line.startswith(label)).split()[1:]
              assert fields == ["10001"] * 4, (label, fields)
          assert b"gunicorn" in Path("/proc/1/cmdline").read_bytes()
          for value in ("/data", "/data/basic.sqlite3", "/data/education.sqlite3"):
              info = Path(value).stat()
              assert (info.st_uid, info.st_gid) == (10001, 10001), value
              assert stat.S_IMODE(info.st_mode) & 0o077 == 0, value
          print("Gunicorn PID 1 and persistent paths use UID/GID 10001")
          '
          }

          probe() {
            docker run --rm --network host \
              --user "$(id -u):$(id -g)" \
              --env TEAM_VERIFY_TEACHER_SECRET \
              --mount "type=bind,source=${GITHUB_WORKSPACE}/experiments/kakao-flask/tests,target=/probes,readonly" \
              --mount "type=bind,source=${private_dir},target=/probe-state" \
              --entrypoint python "$IMAGE_TAG" -B -X utf8 \
              /probes/persistence_probe.py "$@"
          }

          docker volume create "$VOLUME_NAME" >/dev/null
          # Simulate a fresh host disk owned by root rather than the image's /data owner.
          docker run --rm --user 0:0 --entrypoint python \
            --mount "type=volume,source=${VOLUME_NAME},target=/data" \
            "$IMAGE_TAG" -B -c '
          import os
          from pathlib import Path
          root = Path("/data")
          assert not list(root.iterdir()), "The test disk must begin empty"
          os.chown(root, 0, 0)
          root.chmod(0o700)
          assert (root.stat().st_uid, root.stat().st_gid) == (0, 0)
          print("Fresh isolated disk starts root-owned")
          '

          start_server
          first_id="$(docker inspect --format '{{.Id}}' "$CONTAINER_NAME")"
          probe prepare --base-url "$PROBE_BASE_URL" \
            --state-file /probe-state/state.json --result-file /probe-state/prepare.json
          check_server_identity
          hold_authenticated_websocket

          # Remove the whole container, preserving only the explicitly named test volume.
          docker stop --time 20 "$CONTAINER_NAME" >/dev/null
          wait "$holder_pid"
          holder_pid=""
          test "$(docker inspect --format '{{.State.ExitCode}}' "$CONTAINER_NAME")" = 0
          docker rm "$CONTAINER_NAME" >/dev/null
          if docker container inspect "$first_id" >/dev/null 2>&1; then
            echo "The original container still exists" >&2
            exit 1
          fi

          start_server
          check_server_identity
          second_id="$(docker inspect --format '{{.Id}}' "$CONTAINER_NAME")"
          test "$first_id" != "$second_id"
          probe verify --state-file /probe-state/state.json --cleanup \
            --result-file /probe-state/verify.json
          python3 - "$private_dir/verify.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text())
          required = (
              "basic_practice_restored", "owner_cookie_retained",
              "personal_archive_and_key_restored", "other_browser_denied",
              "classroom_archive_restored", "classroom_new_authority_only",
              "http_and_websocket_exercised", "education_probe_records_cleaned",
              "basic_probe_record_retained",
          )
          assert all(result.get(key) is True for key in required), "A required persistence check did not pass"
          PY
          printf 'Verified new container identity, HTTP, actual WS, and persisted records\n'
          printf 'No public endpoint was deployed; private probe state is deleted on exit\n'
