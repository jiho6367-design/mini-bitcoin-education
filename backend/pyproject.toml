[project]
name = "mini-bitcoin-backend"
version = "2.0.0"
description = "Mini Bitcoin Education Lab의 Python 백엔드: 지갑·서명·검증·모의 노드·채굴 규칙과 HTTP API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
mini-bitcoin-backend = "mini_bitcoin_backend.api.app:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
